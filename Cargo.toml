[workspace]
members = ["ui"]
default-members = ["."]
resolver = "2"

[package]
name = "cctv"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1"
aes = "0.8"
axum = "0.8"
async-stream = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 2
strip = true
