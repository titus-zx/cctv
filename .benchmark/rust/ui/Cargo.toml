[package]
name = "cctv-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window","Document","Element","HtmlElement","HtmlCollection","HtmlInputElement","HtmlSelectElement","HtmlDialogElement","HtmlFormElement","HtmlTemplateElement","HtmlImageElement","HtmlVideoElement","HtmlMediaElement","HtmlAnchorElement","HtmlButtonElement","Node","NodeList","DocumentFragment","DomTokenList","Event","EventTarget","PointerEvent","KeyboardEvent","Request","RequestInit","Response","Headers","Blob","Url","Location","Navigator","MediaDevices","MediaStream","MediaStreamConstraints","MediaStreamAudioSourceNode","AudioContext","AudioContextOptions","AudioNode","AudioDestinationNode","AudioBuffer","AudioBufferSourceNode","AudioProcessingEvent","ScriptProcessorNode","ReadableStream","ReadableStreamDefaultReader","AbortController","AbortSignal","console"] }
